<text x="620.0" y="428.0" font-size="9" fill="#12212f" text-anchor="start" font-weight="normal" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" letter-spacing="0" opacity="1">100 nF at the module</text>
<text x="620.0" y="446.0" font-size="9" fill="#12212f" text-anchor="start" font-weight="normal" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" letter-spacing="0" opacity="1">SPI mode 0, 1 MHz, read only</text>
<text x="620.0" y="470.0" font-size="9" fill="#922b21" text-anchor="start" font-weight="normal" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" letter-spacing="0" opacity="1">Do NOT feed an Adafruit board</text>
<text x="620.0" y="486.0" font-size="9" fill="#922b21" text-anchor="start" font-weight="normal" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" letter-spacing="0" opacity="1">Vin from 3V3 - it needs 5 V.</text>
