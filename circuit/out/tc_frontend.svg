<text x="1195.0" y="314.0" font-size="8.5" fill="#5d6d7e" text-anchor="middle" font-weight="normal" font-family="DejaVu Sans Mono, Consolas, monospace" letter-spacing="0" opacity="1">CE0 8 · SCLK 11 · MISO 9</text>
<rect x="1030.0" y="150.0" width="330.0" height="110.0" rx="10" fill="#ffffff" stroke="#c8d2da" stroke-width="1" opacity="1"/>
<rect x="1030.0" y="150.0" width="4.0" height="110.0" rx="2" fill="#0f2a44" stroke="none" stroke-width="1" opacity="1"/>
<text x="1048.0" y="176.0" font-size="12" fill="#0f2a44" text-anchor="start" font-weight="bold" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" letter-spacing="1.2" opacity="1">ONE READING</text>
<text x="1050.0" y="194.0" font-size="10.5" fill="#12212f" text-anchor="start" font-weight="normal" font-family="DejaVu Sans Mono, Consolas, monospace" letter-spacing="0" opacity="1">T = f(V_tc) + T_cold</text>
<text x="1050.0" y="216.0" font-size="9" fill="#5d6d7e" text-anchor="start" font-weight="normal" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" letter-spacing="0" opacity="1">the chip does the inverse, you</text>
<text x="1050.0" y="232.0" font-size="9" fill="#5d6d7e" text-anchor="start" font-weight="normal" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" letter-spacing="0" opacity="1">just read SPI and apply cal.</text>
<rect x="80.0" y="560.0" width="580.0" height="300.0" rx="10" fill="#fff" stroke="#c8d2da" stroke-width="1" opacity="1"/>
<text x="98.0" y="586.0" font-size="10.5" fill="#0f2a44" text-anchor="start" font-weight="bold" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" letter-spacing="0.8" opacity="1">THE PHYSICS — WHY THE COLD JUNCTION MATTERS</text>
<text x="98.0" y="616.0" font-size="12" fill="#8e44ad" text-anchor="start" font-weight="bold" font-family="DejaVu Sans Mono, Consolas, monospace" letter-spacing="0" opacity="1">V = S x (T_hot - T_cold)      S = 41 uV/C</text>
<text x="98.0" y="640.0" font-size="9.5" fill="#5d6d7e" text-anchor="start" font-weight="normal" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" letter-spacing="0" opacity="1">A thermocouple does not measure temperature; it measures a</text>
<text x="98.0" y="656.0" font-size="9.5" fill="#5d6d7e" text-anchor="start" font-weight="normal" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" letter-spacing="0" opacity="1">temperature DIFFERENCE. To report T_hot the chip must know</text>
<text x="98.0" y="672.0" font-size="9.5" fill="#5d6d7e" text-anchor="start" font-weight="normal" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" letter-spacing="0" opacity="1">T_cold, so it measures its own die and adds that back.</text>
<text x="98.0" y="700.0" font-size="10" fill="#12212f" text-anchor="start" font-weight="normal" font-family="DejaVu Sans Mono, Consolas, monospace" letter-spacing="0" opacity="1">0 C -&gt; 0.00 mV      100 C -&gt; 4.10 mV</text>
<text x="98.0" y="722.0" font-size="9.5" fill="#5d6d7e" text-anchor="start" font-weight="normal" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" letter-spacing="0" opacity="1">1 C = 41 uV: the whole signal is a few millivolts,</text>
<text x="98.0" y="738.0" font-size="9.5" fill="#5d6d7e" text-anchor="start" font-weight="normal" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" letter-spacing="0" opacity="1">which is why the pair must be twisted and shielded.</text>
<text x="98.0" y="766.0" font-size="9.5" fill="#922b21" text-anchor="start" font-weight="normal" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" letter-spacing="0" opacity="1">Trap 1: the terminal block and the die must be at the</text>
<text x="98.0" y="782.0" font-size="9.5" fill="#922b21" text-anchor="start" font-weight="normal" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" letter-spacing="0" opacity="1">same temperature. Put the module next to the Pi and</text>
<text x="98.0" y="798.0" font-size="9.5" fill="#922b21" text-anchor="start" font-weight="normal" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" letter-spacing="0" opacity="1">the die runs 12 C hot -&gt; every reading is 12 C low.</text>
<text x="98.0" y="826.0" font-size="9.5" fill="#922b21" text-anchor="start" font-weight="normal" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" letter-spacing="0" opacity="1">Trap 2: a broken probe reads ambient. Always check</text>
<text x="98.0" y="842.0" font-size="9.5" fill="#922b21" text-anchor="start" font-weight="normal" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" letter-spacing="0" opacity="1">the MAX6675 open-thermocouple flag before trusting T.</text>
<rect x="690.0" y="560.0" width="630.0" height="300.0" rx="10" fill="#fef5e7" stroke="#e67e22" stroke-width="1" opacity="1"/>
<text x="708.0" y="586.0" font-size="10.5" fill="#b9770e" text-anchor="start" font-weight="bold" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" letter-spacing="0.8" opacity="1">ERROR BUDGET  (M4 = +/-2.0 C, class-1 probe)</text>
<text x="708.0" y="616.0" font-size="9.5" fill="#12212f" text-anchor="start" font-weight="normal" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" letter-spacing="0" opacity="1">K-type probe, class 1</text>
<text x="980.0" y="616.0" font-size="9.5" fill="#12212f" text-anchor="start" font-weight="normal" font-family="DejaVu Sans Mono, Consolas, monospace" letter-spacing="0" opacity="1">1.50 C</text>
<text x="708.0" y="634.0" font-size="9.5" fill="#12212f" text-anchor="start" font-weight="normal" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" letter-spacing="0" opacity="1">cold-junction tracking</text>
<text x="980.0" y="634.0" font-size="9.5" fill="#12212f" text-anchor="start" font-weight="normal" font-family="DejaVu Sans Mono, Consolas, monospace" letter-spacing="0" opacity="1">0.50 C</text>
<text x="708.0" y="652.0" font-size="9.5" fill="#12212f" text-anchor="start" font-weight="normal" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" letter-spacing="0" opacity="1">linearisation + offset</text>
<text x="980.0" y="652.0" font-size="9.5" fill="#12212f" text-anchor="start" font-weight="normal" font-family="DejaVu Sans Mono, Consolas, monospace" letter-spacing="0" opacity="1">0.50 C</text>
<text x="708.0" y="670.0" font-size="9.5" fill="#12212f" text-anchor="start" font-weight="normal" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" letter-spacing="0" opacity="1">12-bit quantisation</text>
<text x="980.0" y="670.0" font-size="9.5" fill="#12212f" text-anchor="start" font-weight="normal" font-family="DejaVu Sans Mono, Consolas, monospace" letter-spacing="0" opacity="1">0.25 C</text>
<text x="1090.0" y="622.0" font-size="13" fill="#922b21" text-anchor="start" font-weight="bold" font-family="DejaVu Sans Mono, Consolas, monospace" letter-spacing="0" opacity="1">RSS = 1.68 C</text>
<text x="1090.0" y="642.0" font-size="9.5" fill="#922b21" text-anchor="start" font-weight="normal" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" letter-spacing="0" opacity="1">budget 2.00 C -&gt; margin 1.19x</text>
<text x="708.0" y="702.0" font-size="9.5" fill="#922b21" text-anchor="start" font-weight="bold" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" letter-spacing="0" opacity="1">A class-2 probe is +/-2.5 C on its own:</text>
<text x="708.0" y="720.0" font-size="9.5" fill="#922b21" text-anchor="start" font-weight="normal" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" letter-spacing="0" opacity="1">RSS becomes 2.62 C and M4 must be restated to +/-2.5.</text>
<text x="708.0" y="744.0" font-size="9.5" fill="#12212f" text-anchor="start" font-weight="normal" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" letter-spacing="0" opacity="1">Ordering rule: specify class 1 (0.004|t|) or better.</text>
<line x1="708.0" y1="758.0" x2="1302.0" y2="758.0" stroke="#f0c9a0" stroke-width="1" stroke-linecap="round" opacity="1"/>
<text x="708.0" y="780.0" font-size="9.5" fill="#5d6d7e" text-anchor="start" font-weight="normal" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" letter-spacing="0" opacity="1">PT100 + MAX31865 gave 0.40 C with 2.5x margin.</text>
<text x="708.0" y="796.0" font-size="9.5" fill="#5d6d7e" text-anchor="start" font-weight="normal" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" letter-spacing="0" opacity="1">This BOM trades that accuracy for 0-1000 C range,</text>
<text x="708.0" y="812.0" font-size="9.5" fill="#5d6d7e" text-anchor="start" font-weight="normal" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" letter-spacing="0" opacity="1">faster response (tau 4 s vs 8 s) and no self-heating.</text>
<text x="708.0" y="838.0" font-size="9.5" fill="#922b21" text-anchor="start" font-weight="bold" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" letter-spacing="0" opacity="1">Meeting M4 therefore depends on the probe class you buy.</text>
</svg>